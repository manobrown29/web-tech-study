<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Triday Series</title>
</head>
<body>
<header>
    <div class="topo">
        <img src="img/logoTriday.webp" alt="Logo Triday">
    </div>
</header>
<main>
    <section>
        <div class="card">
            <div class="sairRegra">
                <h1>Regras</h1>
                <p>Principais regras!</p>
            </div>
            <button id="btnMostrarRegra">Clique aqui!</button>
            <img id="mostrarImgRegra" src="img/regra.jpg" alt="Regras">
        </div>
        <div class="card">
            <div class="sairDica">
                <h1>Dicas</h1>
                <p>Principais dicas!</p>
            </div>
            <button id="btnMostrarDica">Clique aqui!</button>
            <img id="mostrarImgDica" src="img/duvidas.jpg" alt="Dicas">
        </div>
        <div class="card">
            <div class="sairDistancia">
                <h1>Distâncias</h1>
                <p>Todas as distâncias</p>
            </div>
            <button id="btnMostrarDistancias">Clique aqui!</button>
            <img id="mostrarImgDistancias" src="img/distancias.jpg" alt="Distâncias">
        </div>
    </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
